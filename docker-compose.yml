services:
  db:
    image: postgres:16-alpine
    container_name: schooladmin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-schoold}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-az}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - schooladmin-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-schoold}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  schooladmin-db-data:
