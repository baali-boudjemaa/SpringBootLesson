plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = "21.0.2"
    modules = [
            'javafx.controls',
            'javafx.fxml',
            'javafx.graphics',
            'javafx.base'
    ]
}

application {
    mainClass = 'com.rawdati.licensing.VendorLicenseApp'
}

repositories {
    mavenCentral()
}

dependencies {
    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'ch.qos.logback:logback-classic:1.4.11'
}

// Ensure JavaFX modules are included at runtime
run {
    doFirst {
        systemProperty 'javafx.version', '21.0.2'
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'com.rawdati.licensing.VendorLicenseApp'
    }
}