plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.example.mef'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

application {
    mainClass = 'com.example.mef.demo.Launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

javafx {
    version = "23"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.graphics' ]
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-tomcat'

    // Pick ONE database driver — postgresql kept, mysql removed (add back if you actually need both)
    implementation 'org.postgresql:postgresql:42.7.7'

    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
    implementation 'io.jsonwebtoken:jjwt:0.9.1'
    implementation 'org.apache.commons:commons-lang3:3.13.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    compileOnly 'org.projectlombok:lombok'
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.2.0'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JavaFX Icons
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-feather-pack:12.3.1'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.register('jpackageWindows', Exec) {
    dependsOn 'bootJar'
    group = 'distribution'
    description = 'Builds a Windows app-image using jpackage'

    doFirst {
        mkdir "${buildDir}/jpackage"
    }

    commandLine 'jpackage',
            '--type', 'app-image',
            '--name', 'SchoolAdmin',
            '--input', "${buildDir}/libs",
            '--main-jar', 'app.jar',
            '--main-class', 'com.example.mef.demo.Launcher',
            '--dest', "${buildDir}/jpackage",
            '--app-version', project.version.toString().replace('-SNAPSHOT', ''),
            '--java-options', '-Dfile.encoding=UTF-8'
}

tasks.register('jpackageWindowsInstaller', Exec) {
    dependsOn 'jpackageWindows'
    group = 'distribution'
    description = 'Builds a Windows EXE installer using jpackage'

    commandLine 'jpackage',
            '--type', 'exe',
            '--app-image', "${buildDir}/jpackage/SchoolAdmin",
            '--dest', "${buildDir}/jpackage/installer",
            '--app-version', project.version.toString().replace('-SNAPSHOT', ''),
            '--win-menu',
            '--win-shortcut'
}